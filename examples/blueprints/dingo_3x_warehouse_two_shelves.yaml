app:
  headless: false
  renderer: RayTracedLighting

world:
  stage_units_in_meters: 1.0
  physics_dt: 0.0166
  rendering_dt: 0.0166

scene:
  environment:
    usd_path: ../environments/warehouse_two_shelves.usd # replace this path with your environment .usd file
    prim_path: /World/environment
  robots:
    - name: dingo1
      usd_path: ../robots/clearpath_dingo.usd # replace this path with your robot .usd file
      prim_path: /World/dingo1
      position: [2, 0, 0]
      orientation: [1, 0, 0, 0]
      plugins:
        - class: DifferentialControllerPlugin
          params:
            topic_name: cmd_vel
            wheel_radius: 0.0492
            wheel_base: 0.45232
            left_wheel_joint_name: left_wheel_joint
            right_wheel_joint_name: right_wheel_joint
    - name: dingo2
      usd_path: ../robots/clearpath_dingo.usd # replace this path with your robot .usd file
      prim_path: /World/dingo2
      position: [2, 3, 0]
      orientation: [1, 0, 0, 0]
      plugins:
        - class: DifferentialControllerPlugin
          params:
            topic_name: cmd_vel
            wheel_radius: 0.0492
            wheel_base: 0.45232
            left_wheel_joint_name: left_wheel_joint
            right_wheel_joint_name: right_wheel_joint
    - name: dingo3
      usd_path: ../robots/clearpath_dingo.usd # replace this path with your robot .usd file
      prim_path: /World/dingo3
      position: [2, -3, 0]
      orientation: [1, 0, 0, 0]
      plugins:
        - class: DifferentialControllerPlugin
          params:
            topic_name: cmd_vel
            wheel_radius: 0.0492
            wheel_base: 0.45232
            left_wheel_joint_name: left_wheel_joint
            right_wheel_joint_name: right_wheel_joint
robot_plugins:
  - filepath: ../plugins/differential_controller_plugin.py
    classes:
      - DifferentialControllerPlugin