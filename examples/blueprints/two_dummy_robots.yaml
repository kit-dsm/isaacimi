app:
  headless: false
  renderer: RayTracedLighting

world:
  stage_units_in_meters: 1.0
  physics_dt: 0.0166
  rendering_dt: 0.0166

scene:
  environment:
    usd_path: ../environments/cone_cylinder_cube.usd # TODO: asset storage system
    prim_path: /World/environment
  robots:
    - name: dummy1
      usd_path: ../robots/dummy_robot/dummy_robot.usd # TODO: asset storage system
      prim_path: /World/dummy1
      position: [0, 0, 0]
      orientation: [1, 0, 0, 0] # quaternion
      plugins: # optional plugins
        - class: DummyRobotControllerPlugin
        - class: RTXLidarPlugin
          params:
            parent_prim: /World/dummy1/base_footprint/base_link/fr_lidar
            lidar_name: front_right_lidar
            config: SICK_microscan3_ABAZ90ZA1P01
            namespace: dummy1/fr_lidar
            topic_name: point_cloud
            frame_id: fr_lidar
            translation: [0.1, 0, 0]
            rotation: [1, 0, 0, 0]
        - class: RTXLidarPlugin
          params:
            parent_prim: /World/dummy1/base_footprint/base_link/bl_lidar
            lidar_name: back_left_lidar
            config: SICK_microscan3_ABAZ90ZA1P01
            namespace: dummy1/bl_lidar
            topic_name: point_cloud
            frame_id: bl_lidar
            translation: [0.1, 0, 0]
            rotation: [1, 0, 0, 0]
        - class: JointStatePublisherPlugin
          params:
            namespace: dummy1
            topic_name: joint_states
    - name: dummy2
      usd_path: ../robots/dummy_robot/dummy_robot.usd
      prim_path: /World/dummy2
      position: [1.5, 1.5, 0]
      orientation: [1, 0, 0, 0]

robot_plugins:
  - filepath: ../robots/dummy_robot/dummy_robot_plugins.py
    classes:
      - DummyRobotControllerPlugin
  - filepath: ../plugins/joint_state_publisher_plugin.py
    classes:
      - JointStatePublisherPlugin
  - filepath: ../plugins/sensor_plugins.py
    classes:
      - RTXLidarPlugin